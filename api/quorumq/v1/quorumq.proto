syntax = "proto3";

package quorumq.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/arvindxyogesh/quorumq/api/quorumq/v1;quorumqv1";

// QueueService is the public API of a quorumq broker.
//
// Delivery is at-least-once: a claimed job is hidden from other workers for
// its visibility timeout and becomes claimable again if it is not acked
// before the lease expires. A nacked job is retried after an exponential
// backoff; a job delivered more than max_retries + 1 times without an ack is
// moved to the queue's dead-letter queue.
service QueueService {
  // SubmitJob durably enqueues a job and returns its ID.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  // ClaimJob leases the oldest visible job in a queue. The response has no
  // job when nothing is currently claimable.
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  // AckJob marks a leased job as done. It fails with FAILED_PRECONDITION if
  // the lease is no longer the job's current lease.
  rpc AckJob(AckJobRequest) returns (AckJobResponse);
  // NackJob returns a leased job to the queue so it can be retried.
  rpc NackJob(NackJobRequest) returns (NackJobResponse);
  // GetJob returns a job's current state.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  // QueueStats returns counts for a queue.
  rpc QueueStats(QueueStatsRequest) returns (QueueStatsResponse);
  // ListDeadJobs returns a queue's dead-lettered jobs, oldest first.
  rpc ListDeadJobs(ListDeadJobsRequest) returns (ListDeadJobsResponse);
  // RedriveJob moves a dead-lettered job back to its queue with a fresh
  // retry budget.
  rpc RedriveJob(RedriveJobRequest) returns (RedriveJobResponse);
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  // Waiting to be claimed, possibly delayed by a retry backoff.
  JOB_STATE_PENDING = 1;
  // Claimed by a worker; the lease may have expired but nobody has
  // re-claimed the job yet.
  JOB_STATE_LEASED = 2;
  // Acknowledged by a worker. Terminal.
  JOB_STATE_ACKED = 3;
  // Ran out of retries and was moved to the dead-letter queue.
  JOB_STATE_DEAD = 4;
}

message Job {
  string id = 1;
  string queue = 2;
  bytes payload = 3;
  JobState state = 4;
  // Number of times the job has been claimed.
  uint32 attempts = 5;
  uint32 max_retries = 6;
  google.protobuf.Timestamp created_at = 7;
  // When the job next becomes claimable. Unset once the job is acked.
  google.protobuf.Timestamp visible_at = 8;
  // The worker that most recently claimed the job.
  string worker_id = 9;
  // Why the job last failed: the reason given in a nack, or a note that its
  // lease expired.
  string last_error = 10;
  // When the job was dead-lettered. Unset unless state is DEAD.
  google.protobuf.Timestamp dead_at = 11;
}

message SubmitJobRequest {
  string queue = 1;
  bytes payload = 2;
  uint32 max_retries = 3;
}

message SubmitJobResponse {
  string job_id = 1;
}

message ClaimJobRequest {
  string queue = 1;
  string worker_id = 2;
  // How long the job stays hidden from other workers. Defaults to 30s.
  google.protobuf.Duration visibility_timeout = 3;
}

message ClaimJobResponse {
  // Unset when the queue has no claimable job.
  Job job = 1;
  // Token that must be presented to ack or nack this delivery.
  string lease_id = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
}

message AckJobRequest {
  string job_id = 1;
  string lease_id = 2;
}

message AckJobResponse {}

message NackJobRequest {
  string job_id = 1;
  string lease_id = 2;
  // Optional description of the failure, kept on the job as last_error.
  string reason = 3;
}

message NackJobResponse {}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message QueueStatsRequest {
  string queue = 1;
}

message QueueStatsResponse {
  string queue = 1;
  // Jobs claimable right now, including jobs whose lease has expired.
  uint64 visible = 2;
  // Jobs leased to a worker whose lease has not expired.
  uint64 in_flight = 3;
  // Jobs acknowledged since the queue was created.
  uint64 acked = 4;
  // Pending jobs waiting out a retry backoff.
  uint64 delayed = 5;
  // Jobs currently in the dead-letter queue.
  uint64 dead = 6;
}

message ListDeadJobsRequest {
  string queue = 1;
  // Maximum number of jobs to return: 1-100, default 20.
  uint32 limit = 2;
}

message ListDeadJobsResponse {
  repeated Job jobs = 1;
}

message RedriveJobRequest {
  string job_id = 1;
}

message RedriveJobResponse {}
