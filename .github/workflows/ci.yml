name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./test/...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: golangci-lint (integration tests)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: --build-tags integration ./test/...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install buf and protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: buf lint
        run: buf lint
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code api/

  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version go.mod declares, and the latest stable release.
        go: [go.mod, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
      - name: Unit tests (race detector)
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee test.log
      - name: Report failing tests as annotations
        if: failure()
        run: grep -E -- '--- FAIL|panic:|_test\.go:[0-9]+' test.log | head -50 | sed 's/^/::error::/' || true

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Leader-kill integration test (race detector)
        run: |
          set -o pipefail
          go test -tags integration -race -count=1 -v ./test/integration 2>&1 | tee test.log
      - name: Report failing tests as annotations
        if: failure()
        run: grep -E -- '--- FAIL|panic:|_test\.go:[0-9]+' test.log | head -50 | sed 's/^/::error::/' || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t quorumq:dev .
      - name: Compose failover demo on the real image
        run: NO_BUILD=1 ./scripts/compose-failover.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize deploy/k8s | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -
      - name: Validate Prometheus config and dashboard
        run: |
          python3 -m json.tool deploy/grafana/dashboards/quorumq.json > /dev/null
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/cfg:ro" prom/prometheus:v3.1.0 check config /cfg/prometheus.yml
      - name: Validate Compose file
        run: docker compose -f deploy/docker-compose.yml --profile observability config --quiet

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t quorumq:dev .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: quorumq
      - name: Load image into kind
        run: kind load docker-image quorumq:dev --name quorumq
      - name: Deploy, run load in the cluster, force-delete the leader pod
        run: scripts/k8s-smoke.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all -o wide
          kubectl describe pods -l app=quorumq
          kubectl logs -l app=quorumq --tail=40 --prefix

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the cluster with Prometheus and Grafana
        run: docker compose -f deploy/docker-compose.yml --profile observability up -d --build
      - name: Every dashboard query returns data through Grafana
        run: scripts/grafana-check.sh grafana-dashboard.png
      - name: Upload dashboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-dashboard
          path: grafana-dashboard.png
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile observability logs --tail=40
