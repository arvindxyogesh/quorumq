# Temporary: takes a real screenshot of the Grafana dashboard for the README
# and commits it to this branch. Removed again before merging. (rev 2)
name: dashboard-screenshot
on:
  push:
    branches: [partition-k8s-grafana]
    paths: [.github/workflows/screenshot.yml]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker compose -f deploy/docker-compose.yml --profile observability up -d --build
      - run: |
          mkdir -p docs
          scripts/grafana-check.sh docs/grafana-dashboard.png
      - name: Commit the screenshot
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/grafana-dashboard.png
          git commit -m "docs: Grafana dashboard screenshot from CI"
          git push
