model:
  type: lstm             # lstm | gru | bilstm
  input_size: 1
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  seq_len: 60            # look-back window (days)
  horizon: 14            # steps ahead to forecast

data:
  path: data/energy_consumption.csv
  target_col: consumption
  n_test: 120

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  patience: 15           # early stopping patience

logging:
  level: INFO
