# Headless service: gives each pod a stable DNS name
# (quorumq-0.quorumq-peers, ...) for Raft traffic and leader redirects.
# publishNotReadyAddresses lets pods resolve each other before they are
# ready, which they must do to elect a leader and become ready at all.
apiVersion: v1
kind: Service
metadata:
  name: quorumq-peers
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: quorumq
  ports:
    - name: raft
      port: 7000
    - name: grpc
      port: 7070
    - name: http
      port: 8080
